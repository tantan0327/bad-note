# App Store 用のスクリーンショットを 6 枚撮る(§1.4)。
#
# 撮る前に:
#   1. **ストアが要求するサイズの iPhone シミュレータ**を起動しておく。
#      画像の寸法は端末で決まるので、ここでは指定できない。実測値:
#        iPhone 16 Pro Max (6.9") = 1320×2868
#        iPhone 16 Plus    (6.7") = 1290×2796
#        iPhone 16         (6.1") = 1179×2556
#   2. `skip app launch --ios` で Debug ビルドを入れる。
#      **デモデータの投入は `#if DEBUG` なので Release ビルドでは撮れない**
#   3. プロジェクトのルートから流す(`takeScreenshot` は実行場所からの相対):
#        maestro --device <iOS-UDID> test .maestro/10-store-screenshots.yaml
#   4. 撮り終えたら `.maestro/90-wipe-demo.yaml` でデモデータを消す
#
# 出力は `Darwin/fastlane/screenshots/ja/N_ja.png`(fastlane の置き場そのもの)。
# **Maestro 2.11 は実行フォルダの下に書く。** `COMPLETED` と出ても
# プロジェクトには残らない(2026-10-12 に踏んだ)。流したあと取り出す:
#
#   mkdir -p Darwin/fastlane/screenshots/ja
#   D=$(ls -dt ~/.maestro/tests/* | head -1)
#   cp "$D"/10-store-screenshots/takeScreenshot/Darwin/fastlane/screenshots/ja/*.png \
#      Darwin/fastlane/screenshots/ja/
#
# **途中で失敗すると半端な枚数が残る**ので、失敗したら消してから撮り直す。
#
# Android について:
#   - `tab-*` の識別子は **iOS にしか効かない**。SkipUI は `NavigationBarItem` に
#     独自の modifier を渡すので、タブバーに testTag が届かない。
#     Android で流すときは `tapOn: { id: "tab-issues" }` を
#     `tapOn: "課題"` に置き換える(Android の文字列照合は完全一致なので誤爆しない)
#   - `Data/DemoData.swift` も `#if DEBUG` なので Android には存在しない。
#     Play 用に撮るときは、先にデモデータを入れる別の口が要る(`tasks.md` §7)
#
# `clearState: true` は使わない —— このアプリは `@AppStorage("tab")` を持っていて、
# Android で真っ白になる既知の条件に当たる。デモの投入側が先に全消しするので要らない。
appId: com.tange.badnote
---
# ── 下ごしらえ: デモデータを入れる ───────────────────────────────
- launchApp
# **最後に開いたタブが復元される**(`@AppStorage("tab")`)ので、
# ホームに移ってからでないと設定の歯車が無い(2026-10-27 に踏んだ)
- tapOn: "ホーム"
- tapOn:
    id: "home-settings"
- scrollUntilVisible:
    element:
      id: "settings-demo-seed"
    direction: DOWN
- tapOn:
    id: "settings-demo-seed"

# 入れ直してホームの根に戻る。`back` は iOS と Android で挙動が違うので使わない
- launchApp

# **タブは文字で押す。** `tab-*` の識別子はタップが通らないことがある
# (2026-10-18 に確認)。タブバーの文字は画面に 1 つしか無いので誤爆しない
- tapOn: "ホーム"

# ── 1 枚目: ホーム ────────────────────────────────────────────
# めざす姿 / 目標大会までのカウントダウン / 今週の重点 3 枚。アプリの顔
- assertVisible: ".*守りから攻めに切り替える.*"
- takeScreenshot: Darwin/fastlane/screenshots/ja/1_ja

# ── 2 枚目: しばらく触れていない課題 ──────────────────────────
# 忘れ防止の中核(§4.3)。理由を添えた 3 択をその場で出す。
#
# **`scrollUntilVisible` を使わない。** 見出しは 1 枚目の時点で画面の下端に
# 見えているので、スクロールせずに同じ画面を撮ってしまう
# (2026-10-12 の撮影で 1 枚目と 2 枚目が同一ファイルになった)
- swipe:
    direction: UP
- swipe:
    direction: UP
- assertVisible: ".*今週の重点にする.*"
- takeScreenshot: Darwin/fastlane/screenshots/ja/2_ja

# ── 3 枚目: 積み上げ ──────────────────────────────────────────
# 続かない側の答え(§10.5)。累計時間と節目、月ごとの棒
- scrollUntilVisible:
    element:
      id: "home-stats-link"
    direction: DOWN
- tapOn:
    id: "home-stats-link"
- assertVisible:
    id: "stats-lifetime"
- takeScreenshot: Darwin/fastlane/screenshots/ja/3_ja

# 画面を戻さず入れ直す
- launchApp

# ── 4 枚目: 課題一覧 ──────────────────────────────────────────
# 3 層(今週の重点 / 次にやる / いつか)。「いつか」は畳まれた状態
- tapOn: "課題"
- assertVisible:
    id: "issues-add"
- takeScreenshot: Darwin/fastlane/screenshots/ja/4_ja

# ── 5 枚目: 家トレ ────────────────────────────────────────────
# 毎日開く画面。今日は素振りだけ付いていて、残りを押せる状態にしてある
- tapOn: "家トレ"
- assertVisible: ".*素振り.*"
- takeScreenshot: Darwin/fastlane/screenshots/ja/5_ja

# ── 6 枚目: 練習ログ入力 ──────────────────────────────────────
# 日々の記録。手応えの 3 択(できた / 近づいた / 次にやる)まで見せたいので下まで送る
- tapOn: "ホーム"
- scrollUntilVisible:
    element:
      id: "home-record"
    direction: DOWN
- tapOn:
    id: "home-record"
- assertVisible:
    id: "practice-minutes"
# **入力した状態で撮る。** 空のままだと「どれか 1 つを入れると保存できます」の
# 注記が出て、保存も灰色のままになる(使っている画面に見えない)
- tapOn: "+60分"
- tapOn:
    id: "practice-kind-whole"
- swipe:
    direction: UP
- swipe:
    direction: UP
- assertVisible: ".*できた.*"
- takeScreenshot: Darwin/fastlane/screenshots/ja/6_ja

# 何も入れていないので確認は出ずにそのまま閉じる
- tapOn:
    id: "practice-close"
